# Port 80 for ALL hostnames on this box: ACME challenges, then redirect to HTTPS.
#
# Created 2026-09-01 during Phase 5. This block previously lived inside v1's casadana.conf,
# so deleting that file silently took port 80 away from every site -- `certbot renew
# --dry-run` went from 4/4 passing to 3/3 FAILING, and nothing else showed a symptom. It
# would have surfaced as all three certificates expiring about 60 days later.
#
# It has no server_name, so it is the default server for port 80 and answers for any host,
# including ones added later. Keeping it in its own file means no site's lifecycle can take
# it down again -- the `00-` prefix is just to sort it first.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    include /etc/nginx/snippets/letsencrypt-acme-challenge.conf;
    access_log /var/log/nginx/80_access.log;
    error_log  /var/log/nginx/80_error.log error;

    location / { return 301 https://$host$request_uri; }
}

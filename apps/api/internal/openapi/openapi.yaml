openapi: 3.0.3
info:
  title: Casa Dana API
  version: 0.1.0
  description: |
    Casa Dana villa rental API. Public endpoints for booking submission and
    availability lookup. Villa content (names, photos, descriptions) is static
    in the frontend and not exposed by this API.

servers:
  - url: http://localhost:8080
    description: local dev
  - url: https://casa-dana.com
    description: production

tags:
  - name: health
    description: Liveness
  - name: bookings
    description: Booking submission and availability
  - name: pricing
    description: Base rate, fees, season rules and per-date price overrides
  - name: reviews
    description: Guest testimonials linked to bookings
  - name: admin
    description: Admin authentication and user management
  - name: history
    description: Admin activity log

paths:
  /api/health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness probe
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List bookings (paginated, optional status filter)
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/BookingStatus" }
        - name: villa_slug
          in: query
          required: false
          schema: { type: string }
      security:
        - adminSession: []
      responses:
        "200":
          description: Paginated bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBookingsResponse"
        "422":
          description: Invalid query params
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Submit a booking request
      description: |
        Creates a `pending` booking and triggers a confirmation email to the
        guest plus a notification email to the admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "404":
          description: Villa slug not in allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Dates conflict with an existing booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/bookings/{id}:
    delete:
      operationId: deleteBooking
      tags: [bookings]
      summary: Hard delete a booking (cascades to its review)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - adminSession: []
      responses:
        "204":
          description: Deleted
        "404":
          description: Booking not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      operationId: patchBooking
      tags: [bookings]
      summary: Transition a booking's status
      description: |
        Moves a booking through its lifecycle: `pending → approved | rejected |
        cancelled`, `approved → paid | cancelled`, `paid → cancelled`. The
        backend enforces the state machine and rejects invalid transitions
        with 409 `INVALID_STATUS`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchBookingRequest"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/villas/{slug}/availability:
    get:
      operationId: getVillaAvailability
      tags: [bookings]
      summary: Get booked date ranges for a villa
      description: |
        Returns date ranges within the [from, to) window, split by
        confirmation state: `booked_ranges` (approved or paid — hard blocked)
        and `pending_ranges` (awaiting confirmation — a new booking request
        overlapping these would conflict, but nothing is guaranteed yet).
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
          example: casadana
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
          description: Window start (inclusive). YYYY-MM-DD.
          example: "2026-07-01"
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
          description: Window end (exclusive). YYYY-MM-DD.
          example: "2026-08-01"
      responses:
        "200":
          description: Availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "404":
          description: Villa slug not in allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid query params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/villas/{slug}/pricing:
    post:
      operationId: upsertVillaPricing
      tags: [pricing]
      summary: Bulk upsert price overrides for a villa
      description: |
        Sets `price_cents` for each date in the body. Existing overrides on
        the same date are replaced. All dates in one request share the same
        price; submit multiple requests to vary prices across dates.
      security:
        - adminSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
          example: casadana
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPricingRequest"
      responses:
        "201":
          description: Upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsertPricingResponse"
        "404":
          description: Villa slug not in allowlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Invalid payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      operationId: getVillaPricing
      tags: [pricing]
      summary: Get the resolved nightly prices for a villa within a date window
      description: |
        Returns one entry in `nights` for every day in the [from, to) window,
        priced the way the back-office promises: a per-date override wins over
        any season rule, the most expensive rule wins when several overlap, and
        anything left over falls back to the villa's base rate. `overrides` is
        the sparse list of per-date overrides the window contains, kept for
        callers that need the raw rows rather than the resolved price.

        The window is capped at 400 days; a wider one is rejected with 422.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
          example: casadana
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
          description: Window start (inclusive). YYYY-MM-DD.
          example: "2026-07-01"
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
          description: Window end (exclusive). YYYY-MM-DD.
          example: "2026-08-01"
      responses:
        "200":
          description: Price overrides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingResponse"
        "404":
          description: Villa slug not in allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid query params or invalid range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/villas/{slug}/pricing/settings:
    get:
      operationId: getVillaPricingSettings
      tags: [pricing]
      summary: Base rate and fees for a villa
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
          example: casadana
      responses:
        "200":
          description: Pricing settings (all-zero when never configured)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingSettings" }
        "404":
          description: Villa slug not in allowlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      operationId: putVillaPricingSettings
      tags: [pricing]
      summary: Replace base rate and fees
      security:
        - adminSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
          example: casadana
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutPricingSettingsRequest"
      responses:
        "200":
          description: Saved pricing settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingSettings" }
        "401":
          description: Missing or invalid admin session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Villa slug not in allowlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Invalid payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/villas/{slug}/pricing/season-rules:
    get:
      operationId: listVillaSeasonRules
      tags: [pricing]
      summary: List season rules for a villa
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
          example: casadana
      responses:
        "200":
          description: Season rules, earliest start first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListSeasonRulesResponse" }
        "404":
          description: Villa slug not in allowlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: createVillaSeasonRule
      tags: [pricing]
      summary: Add a season rule
      security:
        - adminSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
          example: casadana
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSeasonRuleRequest"
      responses:
        "201":
          description: Created season rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonRule" }
        "401":
          description: Missing or invalid admin session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Villa slug not in allowlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Invalid payload or end_date before start_date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/pricing/season-rules/{id}:
    patch:
      operationId: patchSeasonRule
      tags: [pricing]
      summary: Update a season rule
      description: Partial update; omitted fields are left unchanged.
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchSeasonRuleRequest"
      responses:
        "200":
          description: Updated season rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonRule" }
        "401":
          description: Missing or invalid admin session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Season rule not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Invalid payload or end_date before start_date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: deleteSeasonRule
      tags: [pricing]
      summary: Remove a season rule
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
        "401":
          description: Missing or invalid admin session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Season rule not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/reviews:
    post:
      operationId: submitReview
      tags: [reviews]
      summary: Submit a review for a booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitReviewRequest"
      responses:
        "201":
          description: Review accepted (pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "404":
          description: Booking not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: A review already exists for this booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/reviews/{id}:
    delete:
      operationId: deleteReview
      tags: [reviews]
      summary: Hard delete a review
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
        "401":
          description: Missing or invalid admin session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Review not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      operationId: patchReview
      tags: [reviews]
      summary: Moderate a review
      description: |
        Partial update of status, featured flag, or editorial fields. Omitted
        fields are left unchanged.
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchReviewRequest"
      responses:
        "200":
          description: Updated review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "401":
          description: Missing or invalid admin session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Review not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Invalid payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/admin/reviews:
    get:
      operationId: listAdminReviews
      tags: [reviews]
      summary: List reviews for moderation
      description: Unlike the public list, this returns every status.
      security:
        - adminSession: []
      parameters:
        - name: villa_slug
          in: query
          required: true
          schema: { type: string }
          example: casadana
        - name: status
          in: query
          description: Omit to return all statuses.
          schema: { $ref: "#/components/schemas/ReviewStatus" }
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListReviewsResponse" }
        "401":
          description: Missing or invalid admin session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Missing or unknown villa_slug
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: createAdminReview
      tags: [reviews]
      summary: Create a review without a booking
      description: |
        For testimonials collected outside the booking flow. Guest-submitted
        reviews still go through `POST /api/reviews`.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminReviewRequest"
      responses:
        "201":
          description: Created review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "401":
          description: Missing or invalid admin session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Invalid payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/villas/{slug}/reviews:
    get:
      operationId: listVillaReviews
      tags: [reviews]
      summary: List published reviews for a villa
      description: |
        Public endpoint — returns only `approved` reviews. Use
        `GET /api/admin/reviews` to see pending and rejected ones.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListReviewsResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: submitVillaReview
      tags: [reviews]
      summary: Leave a review on a villa from its public page
      description: |
        Public endpoint — the form on the villa page, for a visitor with no
        booking of ours to point at. Guests coming out of our own booking flow
        use `POST /api/reviews` instead, which ties the review to a booking.

        The review is always created with status `pending`: it appears neither
        in `GET /api/villas/{slug}/reviews` nor in the figures served by
        `GET /api/villas/{slug}/reviews/meta` until an admin approves it.
        `status`, `featured` and `source` are not accepted here — they decide
        whether and how a review is published, and belong to the admin routes.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
          example: casadana
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitVillaReviewRequest"
      responses:
        "201":
          description: Review accepted, awaiting moderation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "404":
          description: Villa slug not in allowlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: |
            Too many submissions from this caller. The only rate-limited route in
            the API: it is the one unauthenticated write, and the budget keeps the
            moderation queue usable. Carries the standard rate-limit headers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/villas/{slug}/reviews/meta:
    get:
      operationId: getVillaReviewMeta
      tags: [reviews]
      summary: Published rating figures for a villa
      description: |
        Computed from the villa's approved reviews. Read-only: the figures move
        when a review is added, moderated or removed, never by being set.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Review meta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewMeta" }
        "404":
          description: Villa slug not in allowlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Admin logout
      responses:
        "204":
          description: Logged out

  /api/admin/me:
    get:
      operationId: adminMe
      tags: [admin]
      summary: Get the current admin user
      security:
        - adminSession: []
      responses:
        "200":
          description: Current admin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all admin users
      security:
        - adminSession: []
      responses:
        "200":
          description: All admin users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAdminUsersResponse"
    post:
      operationId: createAdminUser
      tags: [admin]
      summary: Create a new admin user
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminUserRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "409":
          description: Email already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/admin/users/{id}:
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Delete an admin user
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
        "404":
          description: Admin user not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Cannot delete your own admin account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/admin/history:
    get:
      operationId: listAdminHistory
      tags: [history]
      summary: Paginated activity log for a villa
      description: |
        Append-only record of every change made through the admin dashboard,
        most recent first. Admin-only — there is no public history route.
      security:
        - adminSession: []
      parameters:
        - name: villa_slug
          in: query
          required: true
          schema: { type: string }
          example: casadana
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Activity log page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListHistoryResponse"
        "401":
          description: Missing or invalid admin session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Missing or unknown villa_slug
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          example: ok

    BookingStatus:
      type: string
      enum: [pending, approved, rejected, cancelled, paid]

    HistoryEventType:
      type: string
      enum: [reservation, pricing, review, owner, system]

    HistoryEvent:
      type: object
      required: [id, villa_slug, type, message, actor_email, created_at]
      properties:
        id: { type: string, format: uuid }
        villa_slug: { type: string, example: casadana }
        type: { $ref: "#/components/schemas/HistoryEventType" }
        message:
          type: string
          example: Base price set to €185
        actor_email:
          type: string
          description: Email of the admin who made the change; empty when unattributed.
          example: owner@casadana.example
        created_at: { type: string, format: date-time }

    ListHistoryResponse:
      type: object
      required: [events, total, page, limit]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/HistoryEvent" }
        total: { type: integer, example: 42 }
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }

    PatchBookingRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected, cancelled, paid]
          description: Target status for the transition.

    CreateBookingRequest:
      type: object
      required:
        - villa_slug
        - guest_name
        - guest_email
        - guest_phone
        - check_in
        - check_out
        - adults
      properties:
        villa_slug: { type: string, minLength: 1, maxLength: 64, example: casadana }
        guest_name: { type: string, minLength: 1, maxLength: 120, example: Jane Doe }
        guest_email: { type: string, format: email, maxLength: 255, example: jane@example.com }
        guest_phone: { type: string, minLength: 2, maxLength: 40, example: "+33123456789" }
        check_in:
          type: string
          format: date
          description: ISO date, YYYY-MM-DD
          example: "2026-07-04"
        check_out:
          type: string
          format: date
          description: ISO date, YYYY-MM-DD. Must be strictly after check_in.
          example: "2026-07-11"
        adults: { type: integer, minimum: 1, maximum: 20, example: 2 }
        children: { type: integer, minimum: 0, maximum: 20, default: 0, example: 0 }
        message: { type: string, maxLength: 2000, default: "", example: "" }
        source: { $ref: "#/components/schemas/BookingSource" }
        locale:
          type: string
          enum: [fr, en, es]
          description: >-
            Language the guest is browsing in. Every email about this booking is
            written in it, including the ones sent later (approval, refusal,
            cancellation). Omitted or unsupported falls back to fr.
          example: fr

    BookingResponse:
      type: object
      required:
        - id
        - villa_slug
        - status
        - check_in
        - check_out
        - guest_name
        - guest_email
        - created_at
      properties:
        id: { type: string, format: uuid }
        villa_slug: { type: string }
        status: { $ref: "#/components/schemas/BookingStatus" }
        check_in: { type: string, format: date }
        check_out: { type: string, format: date }
        guest_name: { type: string }
        guest_email: { type: string, format: email }
        created_at: { type: string, format: date-time }
        adults: { type: integer }
        children: { type: integer }
        source: { $ref: "#/components/schemas/BookingSource" }

    BookedRange:
      type: object
      required: [check_in, check_out]
      properties:
        check_in: { type: string, format: date }
        check_out: { type: string, format: date }

    AvailabilityResponse:
      type: object
      required: [booked_ranges, pending_ranges]
      properties:
        booked_ranges:
          type: array
          items: { $ref: "#/components/schemas/BookedRange" }
        pending_ranges:
          type: array
          items: { $ref: "#/components/schemas/BookedRange" }

    PriceOverride:
      type: object
      required: [date, price_cents]
      properties:
        date: { type: string, format: date }
        price_cents:
          type: integer
          minimum: 0
          description: Price in EUR cents (e.g. 9500 = 95.00€).
          example: 9500

    NightlyPrice:
      type: object
      required: [date, price_cents, label]
      properties:
        date: { type: string, format: date }
        price_cents:
          type: integer
          minimum: 0
          description: Effective price in EUR cents for that night.
          example: 9500
        label:
          type: string
          description: >-
            Where the price came from: a season rule's own name, `Custom` for a
            per-date override, or `Standard` for the villa's base rate.
          example: Summer peak

    PricingResponse:
      type: object
      required: [overrides, nights]
      properties:
        overrides:
          type: array
          items: { $ref: "#/components/schemas/PriceOverride" }
        nights:
          type: array
          description: One entry per day in the requested window, in date order.
          items: { $ref: "#/components/schemas/NightlyPrice" }

    ListBookingsResponse:
      type: object
      required: [bookings, page, limit, total]
      properties:
        bookings:
          type: array
          items: { $ref: "#/components/schemas/BookingResponse" }
        page:  { type: integer }
        limit: { type: integer }
        total: { type: integer }

    UpsertPricingRequest:
      type: object
      required: [price_cents, dates]
      properties:
        price_cents:
          type: integer
          minimum: 0
          example: 25000
        dates:
          type: array
          minItems: 1
          items: { type: string, format: date }
          example: ["2026-07-04", "2026-07-05"]

    UpsertPricingResponse:
      type: object
      required: [count]
      properties:
        count: { type: integer }

    PricingSettings:
      type: object
      required: [base_price_cents, min_nights, cleaning_fee_cents, concierge_fee_cents]
      description: |
        Base rate and fees, applied whenever no season rule or per-date
        override matches. A villa that has never been configured reads back
        as all-zero rather than 404.
      properties:
        base_price_cents:    { type: integer, minimum: 0, example: 18500 }
        min_nights:          { type: integer, minimum: 1, maximum: 365, example: 3 }
        cleaning_fee_cents:  { type: integer, minimum: 0, example: 8000 }
        concierge_fee_cents: { type: integer, minimum: 0, example: 4500 }

    PutPricingSettingsRequest:
      type: object
      required: [base_price_cents, min_nights, cleaning_fee_cents, concierge_fee_cents]
      properties:
        base_price_cents:    { type: integer, minimum: 0, maximum: 100000000 }
        min_nights:          { type: integer, minimum: 1, maximum: 365 }
        cleaning_fee_cents:  { type: integer, minimum: 0, maximum: 100000000 }
        concierge_fee_cents: { type: integer, minimum: 0, maximum: 100000000 }

    SeasonRule:
      type: object
      required: [id, villa_slug, label, start_date, end_date, price_cents]
      description: |
        A named, inclusive date range with its own nightly price. When several
        rules cover the same night the highest-priced one wins.
      properties:
        id:          { type: string, format: uuid }
        villa_slug:  { type: string, example: casadana }
        label:       { type: string, minLength: 1, maxLength: 120, example: Summer peak }
        start_date:  { type: string, format: date }
        end_date:    { type: string, format: date }
        price_cents: { type: integer, minimum: 0, example: 25000 }

    ListSeasonRulesResponse:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items: { $ref: "#/components/schemas/SeasonRule" }

    CreateSeasonRuleRequest:
      type: object
      required: [label, start_date, end_date, price_cents]
      properties:
        label:       { type: string, minLength: 1, maxLength: 120 }
        start_date:  { type: string, format: date }
        end_date:    { type: string, format: date }
        price_cents: { type: integer, minimum: 0, maximum: 100000000 }

    PatchSeasonRuleRequest:
      type: object
      description: Every field is optional; an omitted field is left unchanged.
      properties:
        label:       { type: string, minLength: 1, maxLength: 120 }
        start_date:  { type: string, format: date }
        end_date:    { type: string, format: date }
        price_cents: { type: integer, minimum: 0, maximum: 100000000 }

    ReviewStatus:
      type: string
      enum: [pending, approved, rejected]

    Review:
      type: object
      required:
        - id
        - booking_id
        - villa_slug
        - author_name
        - rating
        - body
        - status
        - meta
        - source
        - featured
        - created_at
      properties:
        id:          { type: string, format: uuid }
        booking_id:
          type: string
          format: uuid
          nullable: true
          description: Null for admin-authored reviews, which have no booking behind them.
        villa_slug:  { type: string }
        author_name: { type: string }
        rating:      { type: integer, minimum: 1, maximum: 5 }
        body:        { type: string }
        status:      { $ref: "#/components/schemas/ReviewStatus" }
        meta:
          type: string
          description: Free-text context line shown under the author name.
          example: Paris, France · Stayed June 2026
        source:
          type: string
          description: Where the review came from.
          example: via Airbnb · Couple
        featured:
          type: boolean
          description: Pinned to the top of the public reviews section.
        categories:  { $ref: "#/components/schemas/ReviewCategoryRatings" }
        created_at:  { type: string, format: date-time }

    ReviewCategoryRatings:
      type: object
      description: |
        Per-category scores for a single review. Every field is optional and
        nullable: a null means the reviewer did not score that category, which
        keeps it out of the villa's average for that category rather than
        pulling it down with a zero.
      properties:
        cleanliness: { type: number, format: double, minimum: 1, maximum: 5, nullable: true }
        comfort:     { type: number, format: double, minimum: 1, maximum: 5, nullable: true }
        location:    { type: number, format: double, minimum: 1, maximum: 5, nullable: true }
        host:        { type: number, format: double, minimum: 1, maximum: 5, nullable: true }
        value:       { type: number, format: double, minimum: 1, maximum: 5, nullable: true }

    CreateAdminReviewRequest:
      type: object
      required: [villa_slug, author_name, rating]
      properties:
        villa_slug:  { type: string, minLength: 1, maxLength: 64 }
        author_name: { type: string, minLength: 1, maxLength: 120 }
        rating:      { type: integer, minimum: 1, maximum: 5 }
        body:        { type: string, maxLength: 2000, default: "" }
        status:      { $ref: "#/components/schemas/ReviewStatus" }
        meta:        { type: string, maxLength: 2000, default: "" }
        source:      { type: string, maxLength: 64, default: "" }
        featured:    { type: boolean, default: false }
        categories:  { $ref: "#/components/schemas/ReviewCategoryRatings" }

    PatchReviewRequest:
      type: object
      description: Every field is optional; an omitted field is left unchanged.
      properties:
        status:     { $ref: "#/components/schemas/ReviewStatus" }
        featured:   { type: boolean }
        meta:       { type: string, maxLength: 2000 }
        source:     { type: string, maxLength: 64 }
        body:       { type: string, maxLength: 2000 }
        rating:     { type: integer, minimum: 1, maximum: 5 }
        categories: { $ref: "#/components/schemas/ReviewCategoryRatings" }

    ReviewBreakdown:
      type: object
      required: [cleanliness, comfort, location, host, value]
      description: |
        Per-category averages over the villa's approved reviews. A null means no
        approved review has scored that category yet, so the bar is left off
        rather than drawn at zero.
      properties:
        cleanliness: { type: number, format: double, minimum: 1, maximum: 5, nullable: true }
        comfort:     { type: number, format: double, minimum: 1, maximum: 5, nullable: true }
        location:    { type: number, format: double, minimum: 1, maximum: 5, nullable: true }
        host:        { type: number, format: double, minimum: 1, maximum: 5, nullable: true }
        value:       { type: number, format: double, minimum: 1, maximum: 5, nullable: true }

    ReviewMeta:
      type: object
      required: [display_avg, display_count, breakdown]
      description: |
        The villa's published rating, computed from its approved reviews.
        Nothing here is stored or hand-entered: moderating a review into or out
        of `approved` is what moves these numbers, so the figures a guest reads
        always match the reviews on show. `display_avg` is 0 when the villa has
        no approved reviews — read `display_count` to tell that apart from a
        genuine average.
      properties:
        display_avg:   { type: number, format: double, minimum: 0, maximum: 5, example: 4.92 }
        display_count: { type: integer, minimum: 0, example: 128 }
        breakdown:     { $ref: "#/components/schemas/ReviewBreakdown" }

    ListReviewsResponse:
      type: object
      required: [reviews]
      properties:
        reviews:
          type: array
          items: { $ref: "#/components/schemas/Review" }

    SubmitReviewRequest:
      type: object
      required: [booking_id, author_name, rating]
      properties:
        booking_id:  { type: string, format: uuid }
        author_name: { type: string, minLength: 1, maxLength: 120 }
        rating:      { type: integer, minimum: 1, maximum: 5 }
        body:        { type: string, maxLength: 2000, default: "" }

    SubmitVillaReviewRequest:
      type: object
      description: |
        What the villa-page form may set, and nothing else. `status`,
        `featured` and `source` are deliberately absent: the review is always
        stored as `pending` for an admin to moderate.
      required: [author_name, rating, body]
      properties:
        author_name: { type: string, minLength: 1, maxLength: 120 }
        rating:      { type: integer, minimum: 1, maximum: 5 }
        body:        { type: string, minLength: 1, maxLength: 2000 }
        categories:  { $ref: "#/components/schemas/ReviewCategoryRatings" }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Machine-readable error code. Known codes:
                `DATES_CONFLICT`, `UNKNOWN_VILLA`, `VALIDATION`,
                `INTERNAL`, `INVALID_STATUS`.
              example: DATES_CONFLICT
            message:
              type: string
              example: those dates are not available

    BookingSource:
      type: string
      enum: [direct, airbnb, booking_com]

    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AdminUser:
      type: object
      properties:
        id:         { type: string, format: uuid }
        email:      { type: string, format: email }
        created_at: { type: string, format: date-time }

    ListAdminUsersResponse:
      type: object
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }

    CreateAdminUserRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string, minLength: 8 }

  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: casa_admin_session

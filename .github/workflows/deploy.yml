name: Build and publish images

# Images are built here rather than on the VPS on purpose: that box has 3.8 GB of
# RAM and also runs the live v1 .NET API. A Bun/Vite build on the host could get
# the API OOM-killed. See docs/adr/0001.
#
# Branch -> environment:
#   main    -> prod  (www.casa-dana.com)
#   develop -> demo  (demo.casa-dana.com)
# The mapping lives here and nowhere else; the deploy script re-checks that the sha is
# actually an ancestor of the branch it was told, so a mis-edit here fails closed.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gates the images: format, lint, TypeScript and dead-code run before anything is
  # built or pushed. `check` is the same script developers run locally, so a green
  # local run means a green job here.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - run: bun install --frozen-lockfile

      # oxfmt --check, oxlint, then tsc (TS 7) on apps/web and packages/api.
      # Compiles paraglide first: src/paraglide is generated and gitignored, so
      # without it every m.* import fails to resolve.
      - name: Format, lint and types
        run: bun run check

      # Only fails on dead code that is NOT already in fallow-suppressions.json.
      # Regenerate that baseline with `bun run dead-code:suppress` after a cleanup.
      - name: Dead code
        run: bun run dead-code:ci

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: .docker/api/Dockerfile
          - name: web
            dockerfile: .docker/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/casadana-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      # NOTE: deliberately no build-args. The web image pins VITE_API_BASE_URL="" in its
      # own Dockerfile so the API is called on a relative /api path. Do NOT pass it here
      # as a build-arg -- setting it to a real URL re-introduces cross-origin cookies.
      # See docs/adr/0003. The assertion below is what actually enforces this.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # Guards docs/adr/0003. A committed apps/web/.env.development sets
      # VITE_API_BASE_URL=http://localhost:8080; bun auto-loads it into process.env when
      # NODE_ENV is unset and Vite prioritises process.env over .env files, so the SPA
      # silently shipped calling localhost and every request failed CORS in the browser.
      # Nothing server-side can detect that, so assert on the artefact.
      - name: Assert the web bundle embeds no absolute API URL
        if: matrix.name == 'web'
        run: |
          IMG="${REGISTRY}/${{ github.repository_owner }}/casadana-web@${{ steps.build.outputs.digest }}"
          docker pull -q "$IMG"
          # A PORT is required in the pattern. The bundle legitimately contains a bare
          # `http://localhost` twice -- TanStack Router falls back to it when window.origin
          # is unavailable, and axios does the same for window.location.href. Matching bare
          # localhost would fail every single build. A leaked VITE_API_BASE_URL always
          # carries a port (http://localhost:8080), which is what this catches.
          FOUND=$(docker run --rm --entrypoint sh "$IMG" -c \
            'cat /usr/share/nginx/html/assets/*.js | grep -oE "https?://(localhost|127\.0\.0\.1):[0-9]+" | sort -u' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::web bundle embeds absolute URL(s): $FOUND — VITE_API_BASE_URL leaked into the build. See docs/adr/0003-same-origin-api-routing.md"
            exit 1
          fi
          echo "OK — bundle contains no absolute localhost/127.0.0.1 URL"

  # Deploys to the VPS over SSH. Runs only after BOTH images are built and the web-bundle
  # assertion has passed, so a bundle with a leaked API URL can never reach production.
  #
  # One image pair serves both environments -- the web bundle embeds no hostname by
  # construction (docs/adr/0003), so the same digest is correct on demo and on prod.
  #
  # The deploy key's authorized_keys entry pins command="/usr/local/bin/casadana-deploy",
  # so this key cannot open a shell or run any other command. The only thing the runner can
  # influence is the argument, which that script regex-validates. See
  # docs/runbooks/continuous-deployment.md.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'demo' }}
    # Never let two deploys to the SAME environment interleave; unlike the build, do not
    # cancel one midway. prod and demo are separate groups -- they touch different
    # checkouts, containers and databases, so a demo deploy must not queue behind prod.
    concurrency:
      group: deploy-${{ github.ref == 'refs/heads/main' && 'prod' || 'demo' }}
      cancel-in-progress: false
    steps:
      - name: Deploy ${{ github.sha }} to ${{ github.ref == 'refs/heads/main' && 'prod' || 'demo' }}
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # StrictHostKeyChecking=yes: the host key is pinned in the secret, so a MITM
          # or a rebuilt host fails the deploy loudly instead of trusting on first use.
          # BatchMode + PreferredAuthentications=publickey: the host still has
          # PasswordAuthentication enabled, so without these ssh falls back to trying a
          # password three times before failing. That wastes time and, on a runner with any
          # tty, could block. Key or nothing.
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=15 \
              -o BatchMode=yes \
              -o PreferredAuthentications=publickey \
              "root@${VPS_HOST}" "deploy ${TARGET_ENV} ${{ github.sha }}"

# Production compose for the Dokploy host (147.93.89.239).
#
# Differences from .docker/docker-compose.yml (dev), and why:
#   - no `caddy` service        -> nginx on the host owns 80/443 (docs/adr/0002)
#   - no `web-dev` service      -> not a dev box
#   - `image:` not `build:`     -> images come from GHCR, built in CI (docs/adr/0001)
#   - ports bound to 127.0.0.1  -> Docker BYPASSES ufw; a bare "8080:8080" would
#                                  publish the API to the internet (docs/adr/0002)
#   - web not on 3000           -> Dokploy's own UI owns 3000
#   - postgres has NO host port -> reachable only on the compose network
#
# nginx terminates TLS and splits traffic by path; the frontend calls the API on a
# relative /api path, so both must be served from one origin (docs/adr/0003).
#
# IMAGE_TAG selects which build to run. CI tags every image with both `latest` and
# `sha-<40-hex-commit>`, and the deploy script pins the sha so a deploy is reproducible
# and a rollback is just re-running with the previous tag:
#   IMAGE_TAG=sha-<sha> docker compose -f ... up -d
# It defaults to `latest` so an interactive `docker compose up -d` still works.
#
# ONE FILE, TWO STACKS. `main` deploys prod (casa-dana.com) and `develop` deploys demo
# (demo.casa-dana.com) from this same file; everything that must differ between them comes
# from the --env-file, so the two can never drift apart in structure. The env files are host
# state, not repo state (they hold secrets): /root/casadana-prod.env and
# /root/casadana-demo.env. See docs/runbooks/environments.md.
#
# STACK_NAME is load-bearing beyond cosmetics: it is the compose PROJECT name, which is what
# namespaces the `postgres_data` volume. Two stacks with the same STACK_NAME share one
# database volume -- demo would write into production. It has NO default for that reason;
# compose errors on the unset variable rather than silently picking one.
name: ${STACK_NAME:?STACK_NAME must be set - it namespaces the postgres volume}

services:
  web:
    image: ghcr.io/lcleris/casadana-web:${IMAGE_TAG:-latest}
    container_name: ${STACK_NAME}-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:?}:80"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      # 127.0.0.1, not localhost. nginx here has a bare `listen 80;` (IPv4 only),
      # but the image's /etc/hosts maps localhost to both 127.0.0.1 and ::1, and
      # BusyBox wget tries ::1 first -- so `http://localhost:80` fails with
      # "can't connect to remote host: Connection refused" even though the site
      # is serving fine. Observed on demo.casa-dana.com 2026-08-10: the container
      # sat (unhealthy) while both 127.0.0.1:3001 and the public URL returned 200.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m

  api:
    image: ghcr.io/lcleris/casadana-api:${IMAGE_TAG:-latest}
    container_name: ${STACK_NAME}-api
    restart: unless-stopped
    environment:
      # POSTGRES_HOST must be the service name, not localhost: the API runs in its
      # own network namespace and the host's Postgres is v1's, which must not be touched.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PORT: "8080"
      COOKIE_SECURE: "true"
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL}
      # Comma-separated CORS allow-list (internal/platform/httpserver/router.go).
      # Same-origin serving means the browser never needs it, but the API requires
      # it to be set. Must match the public origin exactly, scheme included:
      #   demo -> https://demo.casa-dana.com    prod -> https://www.casa-dana.com
      # (www is canonical: the apex 308-redirects to it, as Vercel did before the cutover)
      WEB_ORIGIN: ${WEB_ORIGIN}
      # Applies the embedded migrations at startup (cmd/server/casadana.go).
      # Explicit here because it silently defaults to true.
      MIGRATE_ON_BOOT: "true"
    ports:
      - "127.0.0.1:${API_PORT:?}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # NO healthcheck here, deliberately.
    #
    # .docker/api/Dockerfile builds `FROM scratch` - the image contains the Go
    # binary and nothing else. A CMD/CMD-SHELL healthcheck can never succeed:
    # there is no /bin/sh and no wget, so Docker reports
    #   exec: "/bin/sh": stat /bin/sh: no such file or directory
    # and the container sits in `starting` before going permanently `unhealthy`.
    # (The healthcheck in .docker/docker-compose.yml has this bug - verified
    # 2026-08-10.) Liveness is covered by nginx and by GET /api/health.
    #
    # To restore a real healthcheck, either give the server binary a `healthcheck`
    # subcommand and use ["CMD", "/server", "healthcheck"], or switch the final
    # stage to alpine so wget exists.
    mem_limit: 256m

  postgres:
    image: postgres:16-alpine
    container_name: ${STACK_NAME}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

volumes:
  postgres_data:

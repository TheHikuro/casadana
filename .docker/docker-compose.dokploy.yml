# Production compose for the Dokploy host (147.93.89.239).
#
# Differences from .docker/docker-compose.yml (dev), and why:
#   - no `caddy` service        -> nginx on the host owns 80/443 (docs/adr/0002)
#   - no `web-dev` service      -> not a dev box
#   - `image:` not `build:`     -> images come from GHCR, built in CI (docs/adr/0001)
#   - ports bound to 127.0.0.1  -> Docker BYPASSES ufw; a bare "8080:8080" would
#                                  publish the API to the internet (docs/adr/0002)
#   - web on 3001, not 3000     -> Dokploy's own UI owns 3000
#   - postgres has NO host port -> reachable only on the compose network
#
# nginx terminates TLS and splits traffic by path; the frontend calls the API on a
# relative /api path, so both must be served from one origin (docs/adr/0003).
name: casadana

services:
  web:
    image: ghcr.io/lcleris/casadana-web:latest
    container_name: casadana-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m

  api:
    image: ghcr.io/lcleris/casadana-api:latest
    container_name: casadana-api
    restart: unless-stopped
    environment:
      # POSTGRES_HOST must be the service name, not localhost: the API runs in its
      # own network namespace and the host's Postgres is v1's, which must not be touched.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PORT: "8080"
      COOKIE_SECURE: "true"
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL}
      # Comma-separated CORS allow-list (internal/platform/httpserver/router.go).
      # Same-origin serving means the browser never needs it, but the API requires
      # it to be set. Must match the public origin exactly, scheme included:
      #   demo -> https://demo.casa-dana.com    prod -> https://casa-dana.com
      WEB_ORIGIN: ${WEB_ORIGIN}
      # Applies the embedded migrations at startup (cmd/server/casadana.go).
      # Explicit here because it silently defaults to true.
      MIGRATE_ON_BOOT: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # NO healthcheck here, deliberately.
    #
    # .docker/api/Dockerfile builds `FROM scratch` - the image contains the Go
    # binary and nothing else. A CMD/CMD-SHELL healthcheck can never succeed:
    # there is no /bin/sh and no wget, so Docker reports
    #   exec: "/bin/sh": stat /bin/sh: no such file or directory
    # and the container sits in `starting` before going permanently `unhealthy`.
    # (The healthcheck in .docker/docker-compose.yml has this bug - verified
    # 2026-08-10.) Liveness is covered by nginx and by GET /api/health.
    #
    # To restore a real healthcheck, either give the server binary a `healthcheck`
    # subcommand and use ["CMD", "/server", "healthcheck"], or switch the final
    # stage to alpine so wget exists.
    mem_limit: 256m

  postgres:
    image: postgres:16-alpine
    container_name: casadana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

volumes:
  postgres_data:

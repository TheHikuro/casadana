name: casadana
services:
  web:
    build:
      context: ..
      dockerfile: .docker/web/Dockerfile
    container_name: casadana-web
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "3000:80"
    depends_on:
      - api
    healthcheck:
      # 127.0.0.1, not localhost: nginx.conf has a bare `listen 80;` (IPv4 only)
      # while /etc/hosts maps localhost to ::1 as well, and BusyBox wget tries ::1
      # first -- so localhost always reports Connection refused and the container
      # is permanently (unhealthy) despite serving correctly.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  web-dev:
    image: oven/bun:1-alpine
    container_name: casadana-web
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ../:/app
    working_dir: /app
    command: sh -c "bun install && bun --cwd apps/web dev --host 0.0.0.0"

  api:
    build:
      context: ..
      dockerfile: .docker/api/Dockerfile
    container_name: casadana-api
    restart: unless-stopped
    profiles: ["prod", "dev"]
    env_file:
      - ../.env.${APP_ENV:-dev}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # No healthcheck: .docker/api/Dockerfile builds `FROM scratch`, so the image
    # holds the Go binary and nothing else. Any CMD-SHELL probe fails with
    #   exec: "/bin/sh": stat /bin/sh: no such file or directory
    # and the container goes permanently `unhealthy` (verified 2026-08-10).
    # To restore one: give the binary a `healthcheck` subcommand and use
    # ["CMD", "/server", "healthcheck"], or base the final stage on alpine.

  postgres:
    image: postgres:16-alpine
    container_name: casadana-postgres
    restart: unless-stopped
    profiles: ["prod", "dev"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes the $, so these expand inside the container from the vars set
      # in `environment:` above. With a single $, Compose interpolates them at
      # parse time instead and substitutes empty strings when they are not set
      # in the shell or in .docker/.env, silently probing the wrong role.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: casadana-caddy
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  caddy_data:
